<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Mask -->
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#090D16" stroke-width="40" />

  <!-- Glowing Neon Border -->
  <rect x="30" y="30" width="1860" height="1020" rx="24" fill="none" stroke="url(#neon-grad)" stroke-width="8" filter="url(#neon-glow)" />

  <!-- Corner Brackets -->
  <path d="M 60 120 L 60 60 L 120 60" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <path d="M 1800 60 L 1860 60 L 1860 120" fill="none" stroke="#EC4899" stroke-width="6" stroke-linecap="round" />
  <path d="M 60 960 L 60 1020 L 120 1020" fill="none" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" />
  <path d="M 1800 1020 L 1860 1020 L 1860 960" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />

  <!-- Retro Title -->
  <text x="960" y="1040" font-family="'Trebuchet MS', sans-serif" font-size="20" font-weight="900" fill="#F43F5E" text-anchor="middle" letter-spacing="10">
    CYBERPUNK NIGHTS // 2026
  </text>
</svg>
